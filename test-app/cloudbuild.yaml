steps:
  # Print debug information
  - name: 'gcr.io/cloud-builders/bash'
    id: 'debug'
    args:
      - '-c'
      - |
        echo "Current directory: $(pwd)"
        ls -la
        
  # Build the container
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/lucid-api-test:$BUILD_ID', '.']
    
  # Push the container
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args: ['push', 'gcr.io/$PROJECT_ID/lucid-api-test:$BUILD_ID']
    
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lucid-api-test'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lucid-api-test:$BUILD_ID'
      - '--platform'
      - 'managed'
      - '--region'
      - 'europe-west2'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'

# Images to push
images:
  - 'gcr.io/$PROJECT_ID/lucid-api-test:$BUILD_ID'

# Timeout
timeout: '600s' 