steps:
  # Print debug information
  - name: 'gcr.io/cloud-builders/bash'
    id: 'debug-info'
    args:
      - '-c'
      - |
        echo "===== DEBUG INFORMATION ====="
        echo "Build ID: $BUILD_ID"
        echo "Project ID: $PROJECT_ID"
        echo "Current directory: $(pwd)"
        echo "Directory contents:"
        ls -la
        
  # Test if nodejs is available
  - name: 'node:18-slim'
    id: 'node-version'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Node.js version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "Package.json contents:"
        cat package.json

  # Install dependencies with retry logic
  - name: 'node:18-slim'
    id: 'npm-install'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Installing dependencies..."
        npm install --production || (echo "Retrying with verbose output" && npm install --production --verbose)
        
  # Build and create the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/lucid-api-server:$BUILD_ID', '.']
    
  # Verify the built image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'test-image'
    args: ['run', '--rm', 'gcr.io/$PROJECT_ID/lucid-api-server:$BUILD_ID', 'node', '-e', 'console.log("Container test: OK")']
    
  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lucid-api-server:$BUILD_ID']
    
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lucid-api-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lucid-api-server:$BUILD_ID'
      - '--platform'
      - 'managed'
      - '--region'
      - 'europe-west2'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--timeout'
      - '300s'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,NODE_ENV=production'

# Set correct substitutions and variables
substitutions:
  _SERVICE_NAME: lucid-api-server
  _REGION: europe-west2

# The images to be pushed to Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/lucid-api-server:$BUILD_ID'

# Set reasonable timeouts
timeout: '1200s'

# Add options for performance
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY 