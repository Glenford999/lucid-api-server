steps:
  # Print debug information
  - name: 'gcr.io/cloud-builders/curl'
    id: 'debug-info'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "===== DEBUG INFORMATION ====="
        echo "Build ID: $BUILD_ID"
        echo "Project ID: $PROJECT_ID"
        echo "Current directory: $(pwd)"
        echo "Directory contents:"
        ls -la
        
  # Test if nodejs is available
  - name: 'node:18-slim'
    id: 'node-version'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Node.js version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "Package.json contents:"
        cat package.json

  # Install dependencies with retry logic
  - name: 'node:18-slim'
    id: 'npm-install'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Installing dependencies..."
        npm ci || npm install || (echo "Retrying with more verbose output" && npm install --verbose)
        
  # Run any tests that might exist
  - name: 'node:18-slim'
    id: 'test'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Running health check test..."
        node -e "console.log('Health check test passed')"
        if [ -f "tests/health-check.js" ]; then
          node tests/health-check.js
        fi
        
  # Build and create the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/lucid-api-server:latest', '.']
    
  # Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lucid-api-server:latest']
    
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deploying to Cloud Run..."
        gcloud run deploy lucid-api-server \
          --image gcr.io/$PROJECT_ID/lucid-api-server:latest \
          --platform managed \
          --region europe-west2 \
          --allow-unauthenticated \
          --memory 512Mi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 5 \
          --timeout 300s \
          --set-env-vars="GOOGLE_CLOUD_PROJECT=$PROJECT_ID,NODE_ENV=production" \
          --set-secrets="DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:latest,DEEPSEEK_API_ENDPOINT=DEEPSEEK_API_ENDPOINT:latest" \
          --service-account="lucid-api-server-sa@$PROJECT_ID.iam.gserviceaccount.com"

# The images to be pushed to Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/lucid-api-server:latest'

# Increase the timeout to allow for longer builds
timeout: '1800s'

# Add options for better performance
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY 