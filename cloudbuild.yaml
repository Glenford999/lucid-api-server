steps:
# Build the container image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/lucid-api-server:$COMMIT_SHA', '.']

# Push the container image to Container Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/lucid-api-server:$COMMIT_SHA']

# Deploy container image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'lucid-api-server'
  - '--image'
  - 'gcr.io/$PROJECT_ID/lucid-api-server:$COMMIT_SHA'
  - '--region'
  - 'europe-west2'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'
  - '--port'
  - '8080'
  - '--memory'
  - '512Mi'
  - '--cpu'
  - '1'
  - '--min-instances'
  - '0'
  - '--max-instances'
  - '10'
  - '--set-env-vars'
  - 'NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
  - '--timeout'
  - '300s'
  - '--concurrency'
  - '80'
  - '--service-account'
  - 'lucid-api-server@$PROJECT_ID.iam.gserviceaccount.com'

# Store images
images:
- 'gcr.io/$PROJECT_ID/lucid-api-server:$COMMIT_SHA'

# Set timeout to accommodate for build and deployment time
timeout: '1200s' 